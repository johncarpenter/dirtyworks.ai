name: Verify and deploy

# Gate order matters. The content check and the E2E suite both read the BUILT output, so the build
# runs first; a combined `build && deploy` command would build twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm 11 gates install scripts. esbuild, workerd and sharp all need theirs: esbuild and
      # workerd to fetch their platform binaries, sharp because imageService: 'compile' runs it at
      # build time.
      - run: npm ci --no-audit --no-fund
      - run: npm install-scripts approve esbuild workerd sharp fsevents

      - run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Release gate
        run: npm run check:content

      - name: End-to-end tests
        run: npm run test:e2e

      # Proves the server bundle is not being uploaded as a public asset. public/.assetsignore is
      # what prevents it; this is the check that it is still working.
      - name: Deploy dry run
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm install-scripts approve esbuild workerd sharp fsevents

      - run: npm run build

      # Launch gate, not the merge gate: `--launch` promotes outstanding approvals (consent
      # wording, legal copy) from a recorded note to a hard failure. Remove `continue-on-error`
      # once counsel has signed off and this must block a public deploy.
      - name: Launch readiness
        run: npm run check:launch
        continue-on-error: true

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
