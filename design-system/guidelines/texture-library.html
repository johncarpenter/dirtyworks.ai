<!-- @dsCard group="Brand" viewport="700x210" name="Texture library" subtitle="Code-native. No raster generations." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bone);font-family:var(--font-sans)}.k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
<div style="display:grid;gap:6px"><div class="dw-tex-paper" style="height:78px;background:var(--bone-2);border:1.5px solid var(--ink);--texture-opacity-faint:.5"></div><div class="k">Paper grain</div></div>
<div style="display:grid;gap:6px"><div class="dw-tex-halftone" style="height:78px;border:1.5px solid var(--ink);background-color:var(--bone-2)"></div><div class="k">Halftone</div></div>
<div style="display:grid;gap:6px"><div class="dw-tex-carbon" style="height:78px;background:var(--ink);border:1.5px solid var(--ink)"></div><div class="k">Carbon transfer</div></div>
<div style="display:grid;gap:6px"><div class="dw-tex-blueprint" style="height:78px;border:1.5px solid var(--ink)"></div><div class="k">Blueprint field</div></div>
<div style="display:grid;gap:6px"><div style="height:78px;border:1.5px solid var(--ink);display:grid;place-items:center;background:var(--bone-2)"><span class="dw-tex-registration" style="font-family:var(--font-display);font-weight:900;font-size:28px">WORK</span></div><div class="k">Registration drift</div></div></div>
<div class="k" style="margin-top:14px">Visible at display scale; must disappear behind reading text. Never on body copy or inputs.</div></body></html>
