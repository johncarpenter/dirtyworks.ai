<!-- @dsCard group="Spacing" viewport="700x200" name="Interaction states" subtitle="Colour darkens; offsets collapse. No scale, no glow." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bone);font-family:var(--font-sans)}.k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600">
<div style="display:grid;gap:8px;justify-items:start"><div style="background:var(--signal-orange);color:var(--ink);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:12px 16px">Default</div><div class="k">Rest</div></div>
<div style="display:grid;gap:8px;justify-items:start"><div style="background:var(--orange-press);color:var(--ink);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:12px 16px">Hover</div><div class="k">Darker fill · 120ms</div></div>
<div style="display:grid;gap:8px;justify-items:start"><div style="background:var(--orange-press);color:var(--ink);border:1.5px solid var(--ink);box-shadow:1px 1px 0 var(--ink);transform:translate(1px,1px);padding:12px 16px">Press</div><div class="k">Offset collapses 1px</div></div>
<div style="display:grid;gap:8px;justify-items:start"><div style="background:var(--signal-orange);color:var(--ink);border:1.5px solid var(--ink);box-shadow:0 0 0 3px var(--blueprint);padding:12px 16px">Focus</div><div class="k">3px blueprint ring</div></div></div>
<div class="k" style="margin-top:16px">Disabled = 40% opacity, no shadow. Minimum target 44px.</div></body></html>
