<!-- @dsCard group="Brand" viewport="700x170" name="Proof vocabulary" subtitle="The eight labels that carry the identity" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bone);font-family:var(--font-sans)}.k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}</style></head><body><div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="background:var(--blueprint);color:#fff;border:1px solid var(--ink);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em">SOURCE / 03</span><span style="background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em">OWNER / NAMED</span><span style="background:transparent;color:var(--blueprint);border:1px solid var(--blueprint);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em">PERMISSION / TESTED</span><span style="background:var(--verified-acid);color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em">ANSWER / SUPPORTED</span><span style="background:var(--signal-orange);color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em">GAP / OPEN</span><span style="background:transparent;color:var(--signal-orange);border:1px solid var(--signal-orange);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em">ACTION / HUMAN</span><span style="background:var(--ink);color:var(--bone);border:1px solid var(--ink);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em">CHANGE / LOGGED</span><span style="background:var(--verified-acid);color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em">STATUS / OPERATED</span></div>
<div class="k" style="margin-top:16px;line-height:1.7">Never stamp a status on content that does not carry it. Never encode state by colour alone — the label text is the state.</div></body></html>
