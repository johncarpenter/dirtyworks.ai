<!-- @dsCard group="Colors" viewport="700x190" name="Colour meaning" subtitle="Orange = act. Blue = source. Acid = earned." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bone);font-family:var(--font-sans)}.k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}</style></head><body><div style="display:grid;gap:8px">
<div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center"><div style="background:var(--signal-orange);height:38px;border:1.5px solid var(--ink)"></div><span style="font-size:14px"><b>Action, friction, "work here."</b> Ink text only — never bone body copy on orange.</span></div>
<div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center"><div style="background:var(--blueprint);height:38px;border:1.5px solid var(--ink)"></div><span style="font-size:14px"><b>Source, connection, explanation.</b> Links and evidence routes.</span></div>
<div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center"><div style="background:var(--verified-acid);height:38px;border:1.5px solid var(--ink)"></div><span style="font-size:14px"><b>Verified, changed, resolved.</b> Rare, with ink. Never a background theme.</span></div>
<div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center"><div style="background:var(--error);height:38px;border:1.5px solid var(--ink)"></div><span style="font-size:14px"><b>Errors only.</b> Semantic red is not a fifth brand colour.</span></div></div></body></html>
