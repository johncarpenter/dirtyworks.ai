<!-- @dsCard group="Colors" viewport="700x210" name="Contrast matrix" subtitle="Tested pairs. Bone on orange is banned." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bone);font-family:var(--font-sans)}.k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:13px">
<div style="background:var(--bone);color:var(--ink);border:1.5px solid var(--ink);padding:12px"><b>Ink on bone</b><div class="k" style="margin-top:6px">16.07:1 — AAA</div></div>
<div style="background:var(--ink);color:var(--bone);padding:12px"><b>Bone on ink</b><div class="k" style="margin-top:6px;color:var(--steel-2)">16.07:1 — AAA</div></div>
<div style="background:var(--signal-orange);color:var(--ink);border:1.5px solid var(--ink);padding:12px"><b>Ink on orange</b><div class="k" style="margin-top:6px">7.4:1 — AAA</div></div>
<div style="background:var(--blueprint);color:#fff;padding:12px"><b>White on blueprint</b><div class="k" style="margin-top:6px;color:rgba(255,255,255,.7)">5.9:1 — AA</div></div>
<div style="background:var(--verified-acid);color:var(--ink);border:1.5px solid var(--ink);padding:12px"><b>Ink on acid</b><div class="k" style="margin-top:6px">15.1:1 — AAA</div></div>
<div style="background:var(--signal-orange);color:var(--bone);border:1.5px dashed var(--ink);padding:12px"><b>Bone on orange</b><div class="k" style="margin-top:6px;color:var(--ink)">2.2:1 — never</div></div></div></body></html>
