<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bone);font-family:var(--font-sans)}.k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}</style></head><body><div style="display:flex;gap:26px;align-items:flex-start;padding-bottom:12px">
<div style="display:grid;gap:8px;justify-items:center"><div style="width:96px;height:60px;background:var(--bone-3);border:1.5px solid var(--ink);box-shadow:none"></div><div class="k">none</div><div class="k">--shadow-none</div></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:96px;height:60px;background:var(--bone-3);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)"></div><div class="k">3px</div><div class="k">--shadow-hard-sm</div></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:96px;height:60px;background:var(--bone-3);border:1.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink)"></div><div class="k">6px</div><div class="k">--shadow-hard</div></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:96px;height:60px;background:var(--bone-3);border:1.5px solid var(--ink);box-shadow:6px 6px 0 var(--signal-orange)"></div><div class="k">orange</div><div class="k">--shadow-hard-orange</div></div></div>
<div class="k" style="border-top:1.5px solid var(--ink);padding-top:8px">No blur radius anywhere. No glassmorphism. Shadows collapse to 1px on press.</div></body></html>
