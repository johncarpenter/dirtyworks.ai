<!-- @dsCard group="Brand" viewport="700x220" name="Graphic motifs" subtitle="Brackets, redactions, tabs, folios, connectors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bone);font-family:var(--font-sans)}.k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start">
<div style="display:grid;gap:8px"><div style="font-family:var(--font-mono);font-size:20px;font-weight:600;color:var(--blueprint)">[01] [02] [03]</div><div class="k">Source brackets</div></div>
<div style="display:grid;gap:8px"><div style="position:relative;display:inline-block;font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase">THE OPERATION<span style="position:absolute;left:-4px;right:44%;top:-2px;bottom:-2px;background:var(--ink)"></span></div><div class="k">Redaction reveal</div></div>
<div style="display:grid;gap:8px"><div style="display:flex;align-items:flex-end;gap:0"><span style="background:var(--ink);color:var(--bone);font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;padding:5px 10px">TRUST</span><span style="background:var(--bone-2);border:1px solid var(--rule);border-bottom:none;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;padding:5px 10px">METHOD</span></div><div class="k">File tabs</div></div>
<div style="display:grid;gap:8px"><div style="font-family:var(--font-display);font-weight:900;font-size:34px;overflow:hidden;margin-left:-14px">NOT FOUND</div><div class="k">Cropped display word</div></div>
<div style="display:grid;gap:8px"><div style="display:flex;align-items:center;gap:0;height:34px"><span style="width:9px;height:9px;background:var(--blueprint)"></span><span style="flex:1;height:1.5px;background:var(--blueprint)"></span><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;border:1.5px solid var(--blueprint);color:var(--blueprint);padding:4px 7px">B. NGUYEN</span></div><div class="k">Named connector</div></div>
<div style="display:grid;gap:8px"><div style="display:flex;gap:6px;align-items:center"><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;background:var(--verified-acid);border:1px solid var(--ink);padding:4px 7px;font-weight:600">VERIFIED</span><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--steel)">2026-08-25 / 10:14 MT</span></div><div class="k">Status stamp + timestamp</div></div></div></body></html>
